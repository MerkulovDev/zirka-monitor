name: Monitor PROD (Pinned Messages & All Features)

on:
  schedule:
    # Вночі (23:00-07:59) - кожні 30 хвилин
    - cron: '*/30 23,0-7 * * *'
    # Вдень (08:00-22:59) - кожні 15 хвилин
    - cron: '*/15 8-22 * * *'
  workflow_dispatch: # Можна запустити вручну

jobs:
  monitor-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.11.0
        with:
          access_token: ${{ github.token }}
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Create data directory
        run: mkdir -p data
      
      - name: Run monitor PROD script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ADDRESS_CITY: ${{ secrets.ADDRESS_CITY }}
          ADDRESS_STREET: ${{ secrets.ADDRESS_STREET }}
          ADDRESS_HOUSE: ${{ secrets.ADDRESS_HOUSE }}
          TZ: Europe/Kyiv
        run: node monitor.js
      
      - name: Commit and push state file
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Завжди комітимо файл стану, якщо він змінився
          if [ -f data/last_known_schedule.json ]; then
            git add data/last_known_schedule.json
            if [ -n "$(git status --porcelain data/)" ]; then
              git commit -m "📊 Monitor state $(date -u +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
              git push || echo "Nothing to push"
            else
              echo "State file unchanged"
            fi
          else
            echo "State file not found"
          fi

