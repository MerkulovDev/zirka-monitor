name: Monitor PROD (Pinned Messages & All Features)

on:
  schedule:
    # Вночі (23:00-07:59) - кожну годину
    - cron: '0 0-7,23 * * *'
    # Вдень (08:00-22:59) - кожні 20 хвилин
    - cron: '*/20 8-22 * * *'
  workflow_dispatch: # Можна запустити вручну

# GitHub часто дропає заплановані запуски, тому кожен job сам крутить internal-loop
# (перевірка кожні 20 хв протягом ~40 хв). concurrency не дає запускам накладатись:
# новий "kick" стає в чергу і підхоплює одразу після завершення попереднього.
concurrency:
  group: monitor-prod
  cancel-in-progress: false

jobs:
  monitor-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create data directory
        run: mkdir -p data

      - name: Run monitor loop (3 checks × 20 min)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Тема "Електроенергія" в групі мешканців. Не секрети — звичайні id.
          TELEGRAM_GROUP_CHAT_ID: '-1003963564853'
          TELEGRAM_GROUP_THREAD_ID: '527'
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ADDRESS_CITY: ${{ secrets.ADDRESS_CITY }}
          ADDRESS_STREET: ${{ secrets.ADDRESS_STREET }}
          ADDRESS_HOUSE: ${{ secrets.ADDRESS_HOUSE }}
          TZ: Europe/Kyiv
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          run_and_push() {
            node monitor.js || echo "⚠️ monitor.js завершився з помилкою"
            if [ -f data/last_known_schedule.json ]; then
              git add data/last_known_schedule.json
              if [ -n "$(git status --porcelain data/)" ]; then
                git commit -m "📊 Monitor state $(date -u +'%Y-%m-%d %H:%M:%S')" || true
                git pull --rebase origin main || git rebase --abort || true
                git push || echo "⚠️ push не пройшов (повторимо на наступній ітерації)"
              else
                echo "Стан не змінився — коміт не потрібен"
              fi
            else
              echo "Файл стану не знайдено"
            fi
          }

          for i in 1 2 3; do
            echo "▶️ Перевірка $i/3 ($(date -u +'%H:%M:%S') UTC)"
            run_and_push
            if [ "$i" -lt 3 ]; then
              echo "⏳ Чекаємо 20 хв до наступної перевірки..."
              sleep 1200
            fi
          done
