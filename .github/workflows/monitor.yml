name: Power Outage Monitor

on:
  schedule:
    # Запускає кожну годину
    - cron: '0 * * * *'
    # Альтернативи:
    # - cron: '0 */2 * * *'  # Кожні 2 години
    # - cron: '0 */4 * * *'  # Кожні 4 години
    # - cron: '0 8,12,18 * * *'  # О 8:00, 12:00, 18:00
  workflow_dispatch: # Можна запустити вручну

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.11.0
        with:
          access_token: ${{ github.token }}
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Create data directory
        run: mkdir -p data
      
      - name: Run monitor script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADDRESS_CITY: ${{ secrets.ADDRESS_CITY }}
          ADDRESS_STREET: ${{ secrets.ADDRESS_STREET }}
          ADDRESS_HOUSE: ${{ secrets.ADDRESS_HOUSE }}
        run: node monitor.js
      
      - name: Commit and push state file
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Завжди комітимо файл стану, якщо він змінився
          if [ -f data/last_known_schedule.json ]; then
            git add data/last_known_schedule.json
            if [ -n "$(git status --porcelain data/)" ]; then
              git commit -m "Update: Monitor state $(date -u +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
              git push || echo "Nothing to push"
            else
              echo "State file unchanged"
            fi
          else
            echo "State file not found"
          fi

